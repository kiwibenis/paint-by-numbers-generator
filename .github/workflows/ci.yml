name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # A dependency advisory arrives without a commit, so the scan has to
    # run without one too. ADR-0021 requires the scan to fail the build.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Every version the project declares support for. Declaring
        # support for one that is never exercised is a claim, not a fact.
        python-version:
          - "3.12"
          - "3.13"

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests tools

      - name: Format
        run: python -m black --check .

      - name: Type check
        # The trees are named in pyproject.toml, so a bare mypy here
        # checks exactly what a bare mypy checks locally. Checking only
        # src is what let a benchmark call a constructor signature that
        # had not existed for weeks, and a developer tool pass
        # coordinate pairs where packed indices were expected.
        run: mypy

      - name: Test
        run: pytest -q

  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          pip install -e "."
          pip install pip-audit

      - name: Audit dependencies
        # Fails the build on a known vulnerability. Per ADR-0021 a finding
        # is resolved by raising the bound, never by suppressing it here.
        #
        # --skip-editable excludes this project itself, which is not on
        # PyPI and cannot be audited. --strict is not used, because it
        # would turn that unavoidable skip into a permanent failure.
        run: pip-audit --skip-editable --progress-spinner off